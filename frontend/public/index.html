<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="TAREEQ — Martian Map: an interactive Mars navigation system for terrain analysis and route planning using A* pathfinding."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>TAREEQ — Martian Map</title>
    <script>
      // Required for Cesium static assets
      window.CESIUM_BASE_URL = '%PUBLIC_URL%/cesium/';
    </script>
    <link rel="stylesheet" href="%PUBLIC_URL%/cesium/Widgets/widgets.css" />

    <!-- Extended black grotesque for the TAREEQ wordmark (falls back to Arial Black offline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&display=swap"
      rel="stylesheet"
    />

    <noscript><style>#intro { display: none !important; }</style></noscript>

    <style>
      /* ---------- TAREEQ opening: the deck's cover slide, then a zoom into Mars ---------- */
      #intro {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        cursor: pointer;
      }

      /* 1920x1080 stage that scales to fit any screen; letterbox is black, so it is invisible */
      #intro .stage {
        position: relative;
        width: min(100vw, calc(100vh * 16 / 9));
        aspect-ratio: 16 / 9;
      }

      #intro .world {
        position: absolute;
        inset: 0;
        transform-origin: 51% 49.6%;      /* centre of the planet */
        animation: world-in 1.8s ease-out backwards;
      }
      #intro .mars {
        position: absolute;
        left: 0; top: 0.85%;
        width: 100%; height: 100%;
        object-fit: cover;
        display: block;
      }
      #intro .grid {
        position: absolute;
        left: 25.79%; top: 3.28%;
        width: 50%;
        display: block;
        animation: fade-in 1.6s ease-out 0.9s backwards;
      }

      #intro svg.type {
        position: absolute;
        inset: 0;
        width: 100%; height: 100%;
        overflow: visible;
      }
      #intro .t-title   { font-family: 'Archivo', 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
                          font-weight: 900; font-stretch: 125%; animation: rise 1.1s cubic-bezier(.2,.7,.2,1) 0.5s backwards; }
      #intro .t-tagline { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 700;
                          animation: rise 1.1s cubic-bezier(.2,.7,.2,1) 0.85s backwards; }
      #intro .t-top     { font-family: 'Archivo', 'Arial Narrow', Arial, sans-serif; font-weight: 600;
                          animation: fade-in 1.2s ease-out 1.2s backwards; }
      #intro .globe     { animation: fade-in 1.2s ease-out 1.2s backwards; }

      /* Loading hint: shows only while the app is still starting */
      #intro .progress {
        position: absolute;
        left: 50%; bottom: 3.2%;
        transform: translateX(-50%);
        width: 22%;
        text-align: center;
        font: 600 clamp(9px, 1.05vw, 14px)/1 'Archivo', Arial, sans-serif;
        letter-spacing: 0.32em;
        color: #d08a72;
        text-transform: uppercase;
        animation: fade-in 1s ease-out 1.6s backwards;
        transition: opacity .4s;
      }
      #intro .progress i {
        display: block;
        height: 2px;
        margin-top: 12px;
        background: rgba(208, 138, 114, .25);
        position: relative;
        overflow: hidden;
      }
      #intro .progress i::after {
        content: '';
        position: absolute; inset: 0;
        width: 40%;
        background: linear-gradient(90deg, transparent, #e3a088, transparent);
        animation: sweep 1.6s ease-in-out infinite;
      }

      /* The zoom: dive into the planet, type fades first, then the whole overlay dissolves into the live map */
      #intro.zooming .world {
        transform: scale(10);
        transition: transform 1.9s cubic-bezier(.6, .04, .9, .4);
      }
      #intro.zooming svg.type,
      #intro.zooming .progress { opacity: 0; transition: opacity .45s ease-in; }
      #intro.fade { opacity: 0; pointer-events: none; transition: opacity .7s ease-out; }

      @keyframes world-in { from { opacity: 0; transform: scale(1.07); } to { opacity: 1; transform: scale(1); } }
      @keyframes fade-in  { from { opacity: 0; } to { opacity: 1; } }
      @keyframes rise     { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
      @keyframes sweep    { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

      @media (prefers-reduced-motion: reduce) {
        #intro *, #intro { animation: none !important; }
        #intro.zooming .world { transform: none; transition: none; }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="intro" role="status" aria-live="polite" aria-label="TAREEQ is loading">
      <div class="stage">
        <div class="world">
          <img class="mars" src="%PUBLIC_URL%/intro/mars.jpg" alt="" draggable="false" />
          <img class="grid" src="%PUBLIC_URL%/intro/route-grid.png" alt="" draggable="false" />
        </div>

        <!-- Everything below is laid out in the deck's own 1920x1080 coordinates -->
        <svg class="type" viewBox="0 0 1920 1080" aria-hidden="true">
          <defs>
            <linearGradient id="copper" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0"    stop-color="#f4c6b0" />
              <stop offset="0.48" stop-color="#d48a70" />
              <stop offset="0.52" stop-color="#bf5f46" />
              <stop offset="1"    stop-color="#e8a78e" />
            </linearGradient>
          </defs>

          <!-- globe mark -->
          <g class="globe" fill="none" stroke="#fff" stroke-width="3.5" transform="translate(128 86)">
            <circle r="21" />
            <ellipse rx="9" ry="21" />
            <path d="M-21 0H21M-17 -11H17M-17 11H17" />
          </g>

          <text class="t-top" x="1220" y="104" fill="#d08a72" font-size="40"
                textLength="595" lengthAdjust="spacingAndGlyphs">NASA SPACE APPS CHALLENGE 2026</text>

          <text class="t-title" x="112" y="772" fill="url(#copper)" font-size="152"
                textLength="871" lengthAdjust="spacingAndGlyphs">TAREEQ</text>

          <text class="t-tagline" x="150" y="840" fill="url(#copper)" font-size="35"
                textLength="605" lengthAdjust="spacingAndGlyphs">MAP THE UNKNOWN. FIND THE WAY</text>
        </svg>

        <div class="progress">Initializing 3D Mars<i></i></div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      // Opening sequence: show the cover, wait until the app has mounted, then zoom into Mars.
      (function () {
        var intro = document.getElementById('intro');
        if (!intro) return;

        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var seen = false;
        try { seen = sessionStorage.getItem('tareeq-intro') === '1'; } catch (e) {}

        var minMs = (seen || reduce) ? 500 : 3600;   // full cinematic only once per browser tab
        var t0 = Date.now();
        var loaded = document.readyState === 'complete';
        var started = false;
        window.addEventListener('load', function () { loaded = true; });

        function appMounted() {
          var r = document.getElementById('root');
          return !!(r && r.children.length > 0);
        }

        function finish() {
          document.body.classList.add('app-loaded');
          if (intro && intro.parentNode) intro.parentNode.removeChild(intro);
        }

        function start() {
          if (started) return;
          started = true;
          try { sessionStorage.setItem('tareeq-intro', '1'); } catch (e) {}
          if (seen || reduce) {
            intro.classList.add('fade');
            setTimeout(finish, 750);
          } else {
            intro.classList.add('zooming');
            setTimeout(function () { intro.classList.add('fade'); }, 1250);
            setTimeout(finish, 2100);
          }
        }

        var timer = setInterval(function () {
          var elapsed = Date.now() - t0;
          if ((loaded && appMounted() && elapsed >= minMs) || elapsed > 20000) {
            clearInterval(timer);
            start();
          }
        }, 100);

        // Click or Esc skips the wait (the zoom still starts only once the app is ready)
        function skip() { minMs = 0; }
        intro.addEventListener('click', skip);
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') skip(); });
      })();
    </script>
  </body>
</html>
