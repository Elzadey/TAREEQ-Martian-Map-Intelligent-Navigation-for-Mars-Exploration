name: Frontend CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test -- --watchAll=false
      - run: npm run build
      - name: Validate Docker Compose
        run: docker compose -f ../docker/compose/docker-compose.yml config --quiet
      - name: Build frontend production image
        run: docker build --target production -f ../docker/frontend/Dockerfile .
